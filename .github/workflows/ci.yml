name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (the tests do not need the heavy deep-learning libraries)
        run: |
          grep -Ev '^(torch|sentence-transformers|mlflow|shap|optuna|pyarrow)==' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
      - run: ruff check .
      - run: ruff format --check ml services
      - run: pytest -q

  web:
    name: Web (lint + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  database:
    name: Database (migrations + 22 assertions)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-throwaway   # disposable CI container, not a real credential
          POSTGRES_DB: tapdix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ci-only-throwaway
      PGDATABASE: tapdix
    steps:
      - uses: actions/checkout@v7
      - run: bash db/apply_all.sh
